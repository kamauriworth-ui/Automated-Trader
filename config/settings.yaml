# ---------------------------------------------------------------
# Non-secret settings for the trading system.
# Secrets (API keys) do NOT go here — they go in .env.
# ---------------------------------------------------------------

# Stocks the system will monitor. Add or remove ticker symbols here;
# no Python code needs to change. Find symbols with:  python -m trader search <name>
#
# Note: Anthropic is a private company with no stock of its own. The only match
# at Alpaca (Sept 2026) was an ETF ("ANTW"), so it is deliberately left out.
watchlist:
  - AAPL
  - TSLA
  - NVDA

logging:
  # How chatty the logs are: DEBUG, INFO, WARNING, ERROR
  level: INFO
  # Where the log file is written (folder is created automatically)
  file: logs/trader.log

market_data:
  # Where prices come from. "iex" is free but covers only ONE stock exchange
  # (a small slice of all trading). "sip" covers every exchange but needs a paid
  # Alpaca data plan.
  feed: iex
  # Adjust old prices for stock splits and dividends so history lines up with
  # today's prices. Keep this as "all" unless you know why you'd change it.
  adjustment: all
  # How many calendar days of daily candles to fetch (~120 days = ~80 trading days).
  history_days: 120
