# ---------------------------------------------------------------
# Non-secret settings for the trading system.
# Secrets (API keys) do NOT go here — they go in .env.
# ---------------------------------------------------------------

# Stocks the system will monitor. Add or remove ticker symbols here;
# no Python code needs to change. Find symbols with:  python -m trader search <name>
#
# Note: Anthropic is a private company with no stock of its own. The only match
# at Alpaca (Sept 2026) was an ETF ("ANTW"), so it is deliberately left out.
watchlist:
  - AAPL
  - TSLA
  - NVDA

logging:
  # How chatty the logs are: DEBUG, INFO, WARNING, ERROR
  level: INFO
  # Where the log file is written (folder is created automatically)
  file: logs/trader.log

market_data:
  # Where prices come from. "iex" is free but covers only ONE stock exchange
  # (a small slice of all trading). "sip" covers every exchange but needs a paid
  # Alpaca data plan.
  feed: iex
  # Adjust old prices for stock splits and dividends so history lines up with
  # today's prices. Keep this as "all" unless you know why you'd change it.
  adjustment: all
  # How many calendar days of daily candles to fetch (~120 days = ~80 trading days).
  history_days: 120
  # Freshness check: while the market is open, if the newest price is older than
  # this many minutes, the data is marked STALE and must not be used for decisions.
  max_price_age_minutes: 5

strategy:
  # Trend/Momentum strategy settings (see trader/strategy/trend_momentum.py).
  # All counts are TRADING days. These are common starting points, not proven
  # best values - Phase 5 (backtesting) is where we test alternatives.
  short_ma_days: 20     # "recent direction" moving average
  long_ma_days: 50      # "bigger direction" moving average
  momentum_days: 10     # compare today's close with this many days ago
  volume_avg_days: 20   # compare today's volume with the average of this many days
  atr_days: 14          # volatility measure (shown only; used for stop-losses in Phase 6)
  volume_min_ratio: 1.0 # volume must be at least this x its average to BUY (0 = volume rule off)

backtest:
  # How far back to test, in years. The most recent `holdout_years` are kept
  # SEALED: normal runs never show them, so we can't tune settings to fit them.
  # Run `python -m trader backtest --holdout` once, at the end, as a final exam.
  years: 5
  holdout_years: 1
  trade_amount: 10000   # dollars per trade (Phase 6 replaces this with real position sizing)
  slippage_pct: 0.05    # assumed worse price on every buy AND every sell, in percent
  feed: sip             # full-market history if your data plan allows it; falls back to iex
  reinvest: false       # true = each trade uses all the money that stock's account has
